apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# All resources land in the confpilot namespace (kustomize injects it into
# namespaced resources; the Namespace object itself stays cluster-scoped).
namespace: confpilot

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - otel-collector-configmap.yaml
  - otel-collector-deployment.yaml
  - otel-collector-service.yaml
  - embed-worker-deployment.yaml

# Part-of label on every resource's metadata. Selectors are set explicitly in
# each workload, so no selector rewriting is needed.
labels:
  - pairs:
      app.kubernetes.io/part-of: confpilot
