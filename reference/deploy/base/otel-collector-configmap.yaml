apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        send_batch_size: 512
        timeout: 5s

    exporters:
      # Dash0 OTLP/HTTP. Endpoint and auth header come from the confpilot-secrets
      # Secret (DASH0_OTLP_ENDPOINT / DASH0_TOKEN) injected as container env vars.
      otlphttp/dash0:
        endpoint: ${env:DASH0_OTLP_ENDPOINT}
        headers:
          Authorization: "Bearer ${env:DASH0_TOKEN}"
      # Local debugging exporter — remove in prod.
      debug:
        verbosity: basic

    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dash0, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dash0, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/dash0, debug]
