name: Deploy
# On every merge to main: build the image, push it to GHCR, then roll it out to EKS.
# The rollout needs the KUBE_CONFIG repo secret (deploy/make-deployer-kubeconfig.ps1).
# Without it the image is still built and pushed, and the workflow succeeds.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zackhada/confpilot
  NAMESPACE: confpilot
  DEPLOYMENT: confpilot
  CONTAINER: app

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    name: Roll out to EKS
    needs: image
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read in `if:`, so the steps test this variable instead.
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Skip when KUBE_CONFIG is not set
        if: env.KUBE_CONFIG == ''
        run: echo "::notice::KUBE_CONFIG secret is not set. Image pushed; rollout skipped."

      - name: Write kubeconfig
        if: env.KUBE_CONFIG != ''
        run: |
          umask 077
          # Accept the kubeconfig as pasted YAML or as base64.
          if printf '%s' "$KUBE_CONFIG" | grep -q '^apiVersion:'; then
            printf '%s\n' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          else
            printf '%s' "$KUBE_CONFIG" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          fi
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Set image and wait for the rollout
        if: env.KUBE_CONFIG != ''
        run: |
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE:$GITHUB_SHA"
          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=180s

      - name: Show pods when the rollout fails
        if: failure() && env.KUBE_CONFIG != ''
        run: kubectl -n "$NAMESPACE" get pods -o wide

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
