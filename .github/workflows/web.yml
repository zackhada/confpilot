name: Web
on:
  pull_request:
    paths: ["web/**", "contracts/**", "content/**", ".github/workflows/web.yml"]
  push:
    branches: [main]
    paths: ["web/**", "contracts/**", "content/**", ".github/workflows/web.yml"]
permissions:
  contents: read
jobs:
  web:
    name: web lint, typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Same versions as deploy/Dockerfile (PNPM_VERSION, NODE_VERSION) and web/package.json engines.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
