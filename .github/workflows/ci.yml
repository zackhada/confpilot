name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  repo-rules:
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-kickoff code stays in reference/
        run: |
          for dir in app data; do
            if [ -e "$dir" ]; then
              echo "::error::$dir/ is pre-kickoff code and must live under reference/"
              exit 1
            fi
          done
      - name: Nothing outside reference/ uses reference/
        run: |
          if grep -rnE "(from|import) +reference|reference/(app|data|deploy)" \
              --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' \
              --include='Dockerfile*' --include='*.yaml' --include='*.yml' \
              --exclude-dir=reference --exclude-dir=.git --exclude-dir=node_modules \
              --exclude-dir=.github . ; then
            echo "::error::Code outside reference/ must not use the pre-kickoff scaffold"
            exit 1
          fi
      - name: No .env files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::.env files must not be committed"
            exit 1
          fi
