name: Deploy check
# Runs on pull requests that touch the image or anything that goes into it, so main never
# holds a Dockerfile that does not build. The image is built and started, never pushed.
on:
  pull_request:
    paths:
      - "deploy/**"
      - "api/**"
      - "web/**"
      - "es/**"
      - "contracts/**"
      - "content/glossary.json"
      - ".github/workflows/deploy-check.yml"

permissions:
  contents: read

concurrency:
  group: deploy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0
      KUBERNETES_VERSION: "1.34.0"
    steps:
      - uses: actions/checkout@v4

      - name: Render each kustomization and validate it with kubeconform
        run: |
          set -euo pipefail
          for dir in deploy/k8s deploy/hello; do
            if [ ! -f "$dir/kustomization.yaml" ]; then
              echo "::notice::$dir has no kustomization.yaml yet, skipped"
              continue
            fi
            echo "::group::$dir"
            kubectl kustomize "$dir" > rendered.yaml
            docker run --rm --interactive "$KUBECONFORM_IMAGE" \
              -strict -summary -kubernetes-version "$KUBERNETES_VERSION" - < rendered.yaml
            echo "::endgroup::"
          done

      # The placeholder image prints its environment to anyone who asks, and the tunnel
      # makes it public. Its pod spec must stay free of config and secrets.
      - name: The hello placeholder gets no config and no secrets
        run: |
          set -euo pipefail
          if [ ! -f deploy/hello/kustomization.yaml ]; then
            echo "::notice::deploy/hello has no kustomization.yaml yet, skipped"
            exit 0
          fi
          kubectl kustomize deploy/hello \
            | yq 'select(.kind == "Deployment" and .metadata.name == "confpilot") | .spec.template.spec' \
            > placeholder.yaml
          if [ ! -s placeholder.yaml ]; then
            echo "::error::deploy/hello no longer renders the confpilot Deployment, so this check cannot run"
            exit 1
          fi
          if grep -n -i -E 'secret|configmap|envFrom|^[[:space:]-]*(env|volumes|volumeMounts):' placeholder.yaml; then
            echo "::error file=deploy/hello/kustomization.yaml::The hello placeholder must not reference a Secret, a ConfigMap, env or volumes"
            exit 1
          fi
          echo "Placeholder pod spec is self-contained."

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: confpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image the way the cluster does and probe /healthz
        run: |
          docker run --detach --name app --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges --publish 8000:8000 confpilot:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8000/healthz; then
              echo
              test "$(docker exec app id -u)" = "10001"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/healthz did not answer within 30 seconds"
          docker logs app
          exit 1
