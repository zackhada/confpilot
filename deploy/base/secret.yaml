apiVersion: v1
kind: Secret
metadata:
  name: confpilot-secrets
type: Opaque
# TEMPLATE ONLY — replace every CHANGE_ME before real deployment. These are
# plaintext placeholders so `kubectl apply -k deploy/base` works out of the box
# for the hackathon. In CI/prod, inject real values via `kubectl create secret`
# or a secret manager instead of committing this file.
stringData:
  # LLM provider keys (RAG assistant / OpenLIT). Populate whichever providers you use.
  OPENAI_API_KEY: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"

  # Elasticsearch credential — pair with ES_URL in the ConfigMap (set only if
  # your Elasticsearch requires auth).
  ES_API_KEY: "CHANGE_ME"

  # Dash0 — consumed by the OpenTelemetry Collector exporter.
  # DASH0_TOKEN is sent as:  Authorization: Bearer ${DASH0_TOKEN}
  # DASH0_OTLP_ENDPOINT is your region's OTLP HTTP endpoint from the Dash0 org
  # settings (Endpoints reference). Typical shape:
  #   https://ingress.<region>.aws.dash0.com:4318   (OTLP/HTTP)
  #   https://ingress.<region>.aws.dash0.com:4317   (OTLP/gRPC)
  DASH0_TOKEN: "CHANGE_ME"
  DASH0_OTLP_ENDPOINT: "https://ingress.us-west-2.aws.dash0.com:4318"
