apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-worker
  labels:
    app.kubernetes.io/name: embed-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embed-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embed-worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embed-worker
          # Same image as the API; only the entrypoint differs.
          # Assumes the app ships app/embed_worker.py (a `python -m app.embed_worker`
          # module). Adjust `command` to whatever module the app/data agents ship.
          image: confpilot-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.embed_worker"]
          envFrom:
            - configMapRef:
                name: confpilot-config
            - secretRef:
                name: confpilot-secrets
          env:
            # Batch of abstracts embedded per loop. 64 with a tight limit reliably
            # exceeds the cap below -> OOMKilled -> CrashLoopBackOff.
            - name: EMBED_WORKER_BATCH_SIZE
              value: "64"
          resources:
            # DELIBERATELY tight memory limit for the Radar AI-investigation demo.
            # Loading an embedding model + a 64-abstract batch needs far more than
            # 32Mi, so this pod is OOMKilled. Fix: apply overlays/oom-fix.
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
