# kubectl apply -k deploy/hello
# The deploy/k8s manifests with a public placeholder image, to prove the HTTPS tunnel
# before the real image exists. traefik/whoami answers 200 on every path (so /healthz
# passes) and echoes WebSocket frames on /echo. `kubectl apply -k deploy/k8s` swaps the
# real app in.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
images:
  - name: ghcr.io/zackhada/confpilot
    newName: traefik/whoami
    newTag: v1.11.0
patches:
  - target:
      kind: Deployment
      name: confpilot
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--port=8000"]
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
