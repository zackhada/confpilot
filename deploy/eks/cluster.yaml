# EKS cluster for confpilot on the hackathon AWS account (045129524740).
# The Hackathon-EKS-Deployer SSO role cannot create IAM roles, so this
# reuses the pre-made cluster and node roles and skips the OIDC provider.
#
#   aws sso login --profile hackathon-team
#   eksctl create cluster -f deploy/eks/cluster.yaml --profile hackathon-team
#   eksctl delete cluster -f deploy/eks/cluster.yaml --profile hackathon-team   # when done
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: confpilot
  region: us-east-1
  version: "1.34"
  tags:
    project: confpilot

iam:
  serviceRoleARN: arn:aws:iam::045129524740:role/HackathonEKSClusterRole
  withOIDC: false

managedNodeGroups:
  - name: default
    instanceType: t3.large
    minSize: 1
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    iam:
      instanceRoleARN: arn:aws:iam::045129524740:role/HackathonEKSNodeRole
