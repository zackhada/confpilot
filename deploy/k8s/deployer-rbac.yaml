# Identity for GitHub Actions (the KUBE_CONFIG repo secret). It can change the confpilot
# Deployment and watch the rollout, and nothing else: no Secrets, no exec, no other
# namespace. Build its kubeconfig with deploy/make-deployer-kubeconfig.ps1.
# Revoke it at any time with: kubectl -n confpilot delete secret deployer-token
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: confpilot
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: confpilot
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
# Long-lived token for the ServiceAccount; the control plane fills in the value.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: confpilot
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: confpilot
    app.kubernetes.io/managed-by: kustomize
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: confpilot
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: confpilot
    app.kubernetes.io/managed-by: kustomize
rules:
  # `kubectl set image` reads the Deployment, then patches it.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["confpilot"]
    verbs: ["get", "patch"]
  # `kubectl rollout status` lists and watches; the pod list is for failure output.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: confpilot
  labels:
    app.kubernetes.io/name: deployer
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: confpilot
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: confpilot
