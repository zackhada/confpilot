# kubectl apply -k deploy/k8s
# Applying this resets the app image to the tag below; roll a specific build out with
# deploy/rollout.ps1 <tag>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - cloudflared.yaml
# Non-secret runtime config. Generated, so the name carries a hash of the content: a
# change here gives the Deployment a new ConfigMap name and rolls the pod. Secrets live
# in the `app-credentials` Secret, which a human creates; it is loaded after this
# ConfigMap, so it wins on a clash. STATIC_DIR and GLOSSARY_PATH are set in the image.
configMapGenerator:
  - name: app-config
    namespace: confpilot
    options:
      labels:
        app.kubernetes.io/name: confpilot
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: confpilot
        app.kubernetes.io/managed-by: kustomize
    literals:
      - OTEL_SERVICE_NAME=confpilot-api
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=confpilot,deployment.environment.name=hackathon
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=https://ingress.us-west-2.aws.dash0.com:4318
      # Origins allowed to call the API from a browser. The phone app is served by the
      # API itself (same origin), so this stays empty, which the API reads as "not set".
      # Add the public URL here only if another origin has to call the API.
      - ALLOWED_ORIGINS=
images:
  - name: ghcr.io/zackhada/confpilot
    newTag: main
