# Strategic-merge patch: fix the embed-worker OOMKilled issue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-worker
spec:
  template:
    spec:
      containers:
        - name: embed-worker
          env:
            # Lower batch size so peak memory stays under the raised cap.
            - name: EMBED_WORKER_BATCH_SIZE
              value: "8"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
