[project]
name = "confpilot-es"
version = "0.1.0"
description = "Elasticsearch data layer for ConfPilot: percolator, hybrid search, knowledge and recap"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch[async]>=9.5.1",
    "opentelemetry-api>=1.45.2",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["confpilot_es"]

[tool.hatch.build.targets.wheel.force-include]
"mappings" = "confpilot_es/mappings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["live: needs the live Elasticsearch project (ES_URL and ES_API_KEY, or ENV_FILE)"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
